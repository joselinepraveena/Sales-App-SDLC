name: reusable-service-release

on:
  workflow_call:
    inputs:
      runtime:
        required: true
        type: string
      image_name:
        required: true
        type: string
      working_directory:
        required: true
        type: string
      chart_name:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write
  security-events: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Azure login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${ACR_NAME}"
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}

      - name: Build, scan, sign, and push
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ inputs.image_name }}
          DIGEST_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build --push \
            --provenance=true \
            --sbom=true \
            -t "${IMAGE}:${DIGEST_TAG}" \
            "${{ inputs.working_directory }}"
          echo "Production images are promoted by digest only. Never rebuild per environment."

      - name: Package and push Helm chart
        run: |
          helm package charts/sales-service --version "0.1.0+${GITHUB_SHA::7}"
          echo "Push the signed OCI chart to ACR after Cosign keyless signing is configured."

      - name: Open GitOps promotion pull request
        run: |
          echo "Automation opens a GitOps PR updating development with the approved image digest and chart version."
