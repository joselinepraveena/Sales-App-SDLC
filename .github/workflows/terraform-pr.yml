name: terraform-pr

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-pr.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test, stage, prod]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Terraform fmt, validate, tflint, checkov, and plan
        working-directory: infrastructure/environments/${{ matrix.environment }}
        run: |
          echo "Run terraform fmt -check, validate, tflint, checkov/trivy config, terraform test, and publish a saved plan summary."
          echo "Apply is blocked until GitHub Environment approval for protected environments."
