[package]
name = "notification-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
axum = "0.8.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
uuid = { version = "=1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
