---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images-from-acr
  annotations:
    policies.kyverno.io/title: Restrict images to signed ACR digests
    policies.kyverno.io/category: Supply Chain
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: approved-registry
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: Images must come from the approved Azure Container Registry and use a digest.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    notEquals: "acr*.azurecr.io/*@sha256:*"
    - name: drop-all-capabilities
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: Containers must drop all Linux capabilities and run as non-root.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
