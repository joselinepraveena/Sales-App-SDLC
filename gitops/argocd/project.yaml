apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sales-platform
  namespace: argocd
spec:
  description: Sales platform applications by environment trust boundary
  sourceRepos:
    - https://github.com/joselinepraveena/Sales-App-SDLC.git
  destinations:
    - namespace: "sales-*"
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
