services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./docs/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports: ["4317:4317", "4318:4318"]

  customer-service:
    build: ./services/customer-service
    ports: ["8081:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sales
      SPRING_DATASOURCE_USERNAME: sales
      SPRING_DATASOURCE_PASSWORD: sales
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy

  product-catalog-service:
    build: ./services/product-catalog-service
    ports: ["8082:8080"]

  pricing-service:
    build: ./services/pricing-service
    ports: ["8083:8080"]
    environment:
      REDIS_URL: redis://redis:6379

  inventory-service:
    build: ./services/inventory-service
    ports: ["8084:8080"]

  order-service:
    build: ./services/order-service
    ports: ["8085:8080"]

  payment-service:
    build: ./services/payment-service
    ports: ["8086:8080"]

  notification-service:
    build: ./services/notification-service
    ports: ["8087:8080"]

  sales-analytics-service:
    build: ./services/sales-analytics-service
    ports: ["8088:8080"]

  web:
    build: ./apps/web
    ports: ["3000:3000"]
